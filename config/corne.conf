# Carried over from the miryoku_zmk fork ------------------------------------

CONFIG_ZMK_SLEEP=y
# Idle sleep timeout in ms (~33 min)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=2000000

CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# New in this config --------------------------------------------------------

# Required for &mkp / &mmv / &msc on the Mouse and Button layers.
# Miryoku emulated mouse movement with numpad scancodes (OS-level MouseKeys),
# which is off by default on macOS. These are real HID pointer reports.
CONFIG_ZMK_POINTING=y
