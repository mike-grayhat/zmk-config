# keymap-drawer configuration
# https://github.com/caksoylar/keymap-drawer

parse_config:
  # zmk-helpers is installed as a Zephyr module via config/west.yml, so its
  # headers are not found automatically. Requires keymap-drawer >= 0.18.0.
  # The draw workflow runs `west update`, which lands it at the repo root.
  zmk_additional_includes: ["zmk-helpers/include"]

  # Show which key activates each layer.
  mark_alternate_layer_activators: true

  # Legends for the behaviors defined in corne.keymap. Without these,
  # keymap-drawer prints the raw binding text (e.g. "&to_tap").
  raw_binding_map:
    "&bootloader": boot

    # Clipboard (Linux/macOS scancodes) read better as words
    "&kp LS(DEL)": cut
    "&kp LC(INS)": copy
    "&kp LS(INS)": paste
    "&kp K_UNDO": undo
    "&kp K_AGAIN": redo

    # Base-layer switching. All of these need TWO taps (double-tap guard).
    "&to_base": {t: Base, s: 2×}
    "&to_extra": {t: Extra, s: 2×}
    "&to_tap": {t: Tap, s: 2×}
    "&to_nav": {t: Nav, s: 2×}
    "&to_mouse": {t: Mouse, s: 2×}
    "&to_media": {t: Media, s: 2×}
    "&to_num": {t: Num, s: 2×}
    "&to_sym": {t: Sym, s: 2×}
    "&to_fun": {t: Fun, s: 2×}

    # Shift-morphs
    "&capsw": {t: caps word, s: CAPS}
    "&out_tog": {t: out, s: USB}
    "&bt0": {t: BT 0, s: clear}
    "&bt1": {t: BT 1, s: clear}
    "&bt2": {t: BT 2, s: clear}
    "&bt3": {t: BT 3, s: clear}

    # Pointer
    "&mkp MB1": click L
    "&mkp MB2": click R
    "&mkp MB3": click M
    "&mmv MOVE_LEFT": "🖱 ←"
    "&mmv MOVE_RIGHT": "🖱 →"
    "&mmv MOVE_UP": "🖱 ↑"
    "&mmv MOVE_DOWN": "🖱 ↓"
    "&msc SCRL_UP": "scrl ↑"
    "&msc SCRL_DOWN": "scrl ↓"
    "&msc SCRL_LEFT": "scrl ←"
    "&msc SCRL_RIGHT": "scrl →"

  zmk_keycode_map:
    # --- keymap-drawer defaults, restored because supplying this key
    # --- replaces the built-in map rather than merging with it
    EXCLAMATION: '!'
    EXCL: '!'
    AT_SIGN: '@'
    AT: '@'
    HASH: '#'
    POUND: '#'
    DOLLAR: $
    DLLR: $
    PERCENT: '%'
    PRCNT: '%'
    CARET: ^
    AMPERSAND: '&'
    AMPS: '&'
    ASTERISK: '*'
    ASTRK: '*'
    STAR: '*'
    LEFT_PARENTHESIS: (
    LPAR: (
    RIGHT_PARENTHESIS: )
    RPAR: )
    EQUAL: '='
    PLUS: +
    MINUS: '-'
    UNDERSCORE: _
    UNDER: _
    SLASH: /
    FSLH: /
    QUESTION: '?'
    QMARK: '?'
    BACKSLASH: \
    BSLH: \
    PIPE: '|'
    NON_US_BACKSLASH: \
    PIPE2: '|'
    NON_US_BSLH: '|'
    SEMICOLON: ;
    SEMI: ;
    COLON: ':'
    SINGLE_QUOTE: ''''
    SQT: ''''
    APOSTROPHE: ''''
    APOS: ''''
    DOUBLE_QUOTES: '"'
    DQT: '"'
    COMMA: ','
    LESS_THAN: <
    LT: <
    PERIOD: .
    DOT: .
    GREATER_THAN: '>'
    GT: '>'
    LEFT_BRACKET: '['
    LBKT: '['
    LEFT_BRACE: '{'
    LBRC: '{'
    RIGHT_BRACKET: ']'
    RBKT: ']'
    RIGHT_BRACE: '}'
    RBRC: '}'
    GRAVE: '`'
    TILDE: '~'
    NON_US_HASH: '#'
    NUHS: '#'
    TILDE2: '~'
    # --- additions for this keymap
    K_UNDO: undo
    K_AGAIN: redo
    K_APP: menu
    PAUSE_BREAK: pause
    PSCRN: prt sc
    SLCK: scroll lk
    C_VOL_UP: vol +
    C_VOL_DN: vol −
    C_MUTE: mute
    C_PP: play
    C_NEXT: next
    C_PREV: prev
    C_STOP: stop
    PG_UP: pg up
    PG_DN: pg dn
    RGB_TOG: rgb
    RGB_EFF: rgb eff
    RGB_HUI: rgb hue
    RGB_SAI: rgb sat
    RGB_BRI: rgb bri
    EP_TOG: ext pwr

draw_config:
  key_w: 62
  key_h: 58
  split_gap: 32
  n_columns: 2
  draw_key_sides: true
  append_colon_to_layer_header: false
  footer_text: >-
    Chocofi · 42-key Corne · Miryoku layer scheme · generated by keymap-drawer
